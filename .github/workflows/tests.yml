name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v
      - name: Check style
        run: python -m flake8 .
      - name: Build package
        run: python -m build advanced09_package
      - name: Check distributions
        run: python -m twine check advanced09_package/dist/*
